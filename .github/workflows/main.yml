name: Steam Free Games Notifier
run-name: Steam Free Games Notifier
on: 
  schedule:
    - cron: '0 12 * * *'
    
jobs:
  requests:
    name: requests
    runs-on: ubuntu-latest
    steps:
      - name: MakeEnv
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Pip Packge
        run: pip install -r requirements.txt

      - name: Run Script
        run: python script.py

        

        
