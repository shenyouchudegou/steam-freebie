name: Steam Free Games Notifier

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: steam-free-games-notifier
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notify:
    name: Check and notify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate configuration
        env:
          GH_TOKEN: ${{ secrets.REPO_VARIABLE_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ vars.MAIL_TO }}
        run: |
          test -n "$GH_TOKEN" || { echo "Missing secret: REPO_VARIABLE_TOKEN"; exit 1; }
          test -n "$SMTP_HOST" || { echo "Missing secret: SMTP_HOST"; exit 1; }
          test -n "$SMTP_USERNAME" || { echo "Missing secret: SMTP_USERNAME"; exit 1; }
          test -n "$SMTP_PASSWORD" || { echo "Missing secret: SMTP_PASSWORD"; exit 1; }
          test -n "$MAIL_TO" || { echo "Missing variable: MAIL_TO"; exit 1; }
          gh auth status

      - name: Check Steam and send email
        env:
          STEAM_FREEBIE_STATE: ${{ vars.STEAM_FREEBIE_STATE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          SMTP_USE_SSL: ${{ vars.SMTP_USE_SSL || 'true' }}
          SMTP_STARTTLS: ${{ vars.SMTP_STARTTLS || 'false' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_TO: ${{ vars.MAIL_TO }}
          STEAM_COOKIE: ${{ secrets.STEAM_COOKIE }}
        run: python script.py --send-email

      - name: Save current state to repository variable
        env:
          GH_TOKEN: ${{ secrets.REPO_VARIABLE_TOKEN }}
        run: gh variable set STEAM_FREEBIE_STATE --repo "$GITHUB_REPOSITORY" < steam_state.json
