name: Steam Free Games Notifier

on:
  schedule:
    - cron: '47 10 * * *'
  workflow_dispatch:

concurrency:
  group: steam-free-games-notifier
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notify:
    name: Check and notify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate configuration
        env:
          GH_TOKEN: ${{ secrets.VARS_PAT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LIST_ENCRYPTION_KEY: ${{ secrets.LIST_ENCRYPTION_KEY }}
          PGP_PRIVATE_KEY: ${{ secrets.PGP_PRIVATE_KEY }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
        run: |
          test -n "$GH_TOKEN" || { echo "Missing secret: VARS_PAT"; exit 1; }
          test -n "$RESEND_API_KEY" || { echo "Missing secret: RESEND_API_KEY"; exit 1; }
          test -n "$LIST_ENCRYPTION_KEY" || { echo "Missing secret: LIST_ENCRYPTION_KEY"; exit 1; }
          test -n "$PGP_PRIVATE_KEY" || { echo "Missing secret: PGP_PRIVATE_KEY"; exit 1; }
          test -n "$MAIL_FROM" || { echo "Missing variable: MAIL_FROM"; exit 1; }
          gh auth status
          gpg --version

      - name: Read encrypted subscriber variable
        env:
          GH_TOKEN: ${{ secrets.VARS_PAT }}
        run: |
          umask 077
          gh variable get SUBSCRIBERS_ENC --repo "$GITHUB_REPOSITORY" > subscribers.enc

      - name: Check Steam and send email
        env:
          STEAM_FREEBIE_STATE: ${{ vars.STEAM_FREEBIE_STATE }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LIST_ENCRYPTION_KEY: ${{ secrets.LIST_ENCRYPTION_KEY }}
          PGP_PRIVATE_KEY: ${{ secrets.PGP_PRIVATE_KEY }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
        run: python script.py --send-email --subscriber-state-file subscribers.enc

      - name: Save current state to repository variable
        env:
          GH_TOKEN: ${{ secrets.VARS_PAT }}
        run: gh variable set STEAM_FREEBIE_STATE --repo "$GITHUB_REPOSITORY" < steam_state.json
